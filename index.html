<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điểm danh</title>
<style>
  :root { --c:#1d4ed8; --bg:#f1f5f9; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#0f172a; }
  main { max-width:460px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:8px 0 12px; }
  .card { background:#fff; border-radius:12px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:14px; }
  input, textarea { width:100%; padding:11px 12px; font-size:16px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; }
  input:focus, textarea:focus { outline:2px solid var(--c); border-color:var(--c); }
  textarea { min-height:90px; resize:vertical; }
  button { width:100%; margin-top:16px; padding:12px; font-size:16px; font-weight:600; color:#fff; background:var(--c); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { background:#94a3b8; cursor:not-allowed; }
  button.secondary { background:#fff; color:var(--c); border:1px solid var(--c); margin-top:8px; }
  button.secondary:disabled { color:#94a3b8; border-color:#cbd5e1; background:#fff; }
  .msg { margin-top:12px; font-size:14px; min-height:20px; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hint { font-size:13px; color:#475569; margin-top:6px; }
  .loc { margin-top:14px; padding:10px 12px; border-radius:8px; background:#f8fafc; border:1px solid #e2e8f0; font-size:14px; }
  .hidden { display:none; }
  .warn { background:#fef3c7; border:1px solid #f59e0b; padding:10px; border-radius:8px; font-size:14px; margin-bottom:12px; }
  .banner { padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:12px; background:#dbeafe; color:#1e3a8a; }
  .banner.closed { background:#fee2e2; color:#7f1d1d; }
  .banner b { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Điểm danh</h1>

  <div id="cfgWarn" class="warn hidden">Chưa cấu hình địa chỉ máy chủ. Mở file này bằng trình soạn thảo và điền APPS_SCRIPT_URL ở đầu phần script.</div>
  <div id="banner" class="banner hidden" role="status"></div>

  <!-- Bước 1: đăng nhập bằng mã -->
  <section id="stepLogin" class="card">
    <form id="loginForm" autocomplete="off">
      <label for="code">Mã code được cấp</label>
      <input id="code" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="64" required>
      <button id="loginBtn" type="submit" disabled>Đăng nhập</button>
      <div id="loginMsg" class="msg" role="status"></div>
    </form>
  </section>

  <!-- Bước 2: cung cấp thông tin -->
  <section id="stepInfo" class="card hidden">
    <form id="infoForm" autocomplete="off">
      <div id="welcome" class="hint"></div>
      <label for="fullName">Họ và tên</label>
      <input id="fullName" type="text" maxlength="200" required>
      <label for="note">Ghi chú</label>
      <textarea id="note" maxlength="1000" placeholder="Nội dung cần báo (không bắt buộc)"></textarea>

      <div class="loc">
        <strong>Vị trí hiện tại (bắt buộc)</strong>
        <div id="locStatus" class="hint">Chưa lấy vị trí.</div>
      </div>
      <button id="locBtn" type="button" class="secondary">Lấy vị trí hiện tại</button>
      <button id="sendBtn" type="submit" disabled>Gửi điểm danh</button>
      <div id="infoMsg" class="msg" role="status"></div>
    </form>
  </section>

  <!-- Bước 3: xong -->
  <section id="stepDone" class="card hidden">
    <h2 style="margin-top:0">Đã ghi nhận</h2>
    <div id="doneMsg"></div>
    <button id="againBtn" type="button" class="secondary">Quay về đầu</button>
  </section>
</main>

<script>
(function () {
  'use strict';
  // >>> ĐIỀN địa chỉ ứng dụng web Apps Script (kết thúc bằng /exec) <<<
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZM4PO45DtIJBcrNvgs8tjGwg84WpTmsPfQJ7OwmqnIG9QrgN4LwAROdXffNYhF0YxjQ/exec';

  var $ = function (id) { return document.getElementById(id); };
  var state = { code: '', pos: null, open: false, endAt: 0, sessionName: '' };
  var tick = null, poll = null;

  if (!APPS_SCRIPT_URL) $('cfgWarn').classList.remove('hidden');

  function show(id) {
    ['stepLogin', 'stepInfo', 'stepDone'].forEach(function (s) { $(s).classList.add('hidden'); });
    $(id).classList.remove('hidden');
  }
  function setMsg(el, text, cls) { el.textContent = text; el.className = 'msg ' + (cls || ''); }

  // Gửi POST dạng text/plain để tránh preflight CORS với Apps Script.
  function api(payload) {
    if (!APPS_SCRIPT_URL) return Promise.reject(new Error('Chưa cấu hình máy chủ.'));
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }

  // --- Trạng thái đợt điểm danh và đồng hồ đếm ngược ---
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function renderBanner() {
    var b = $('banner');
    b.classList.remove('hidden');
    if (state.open) {
      var left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
      if (left <= 0) { setClosed(); return; }
      b.className = 'banner';
      b.textContent = '';
      b.appendChild(document.createTextNode('Đợt: ' + state.sessionName + ' — còn lại '));
      var t = document.createElement('b'); t.textContent = fmt(left); b.appendChild(t);
    } else {
      b.className = 'banner closed';
      b.textContent = 'Hiện không có đợt điểm danh nào đang mở.';
    }
  }
  function setOpen(name, remainingSec) {
    state.open = true; state.sessionName = name;
    state.endAt = Date.now() + remainingSec * 1000;   // dùng giờ máy chủ, không phụ thuộc đồng hồ máy người dùng
    $('loginBtn').disabled = false;
    renderBanner();
    clearInterval(tick); tick = setInterval(renderBanner, 1000);
    clearInterval(poll); poll = null;
  }
  function setClosed() {
    var wasInfo = !$('stepInfo').classList.contains('hidden');
    state.open = false; state.pos = null;
    clearInterval(tick); tick = null;
    $('loginBtn').disabled = true; $('sendBtn').disabled = true;
    renderBanner();
    if (wasInfo) {
      setMsg($('infoMsg'), 'Đợt điểm danh đã kết thúc, dữ liệu chưa gửi sẽ không được ghi nhận.', 'err');
    }
    clearInterval(poll); poll = setInterval(refreshStatus, 60000);   // tự mở lại khi có đợt mới
  }
  function refreshStatus() {
    api({ action: 'status' }).then(function (res) {
      if (res && res.ok && res.open) setOpen(res.name, res.remainingSec);
      else if (res && res.ok) setClosed();
    }).catch(function () {
      $('banner').className = 'banner closed';
      $('banner').textContent = 'Không kết nối được máy chủ.';
    });
  }
  if (APPS_SCRIPT_URL) refreshStatus();

  // --- Bước 1: đăng nhập ---
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value.trim();
    if (!code || !state.open) return;
    $('loginBtn').disabled = true;
    setMsg($('loginMsg'), 'Đang kiểm tra...', '');
    api({ action: 'login', code: code }).then(function (res) {
      if (res && res.ok) {
        state.code = code;
        $('fullName').value = res.name || '';
        $('welcome').textContent = res.name ? 'Xin chào ' + res.name + (res.unit ? ' (' + res.unit + ')' : '') + '.' : 'Đăng nhập thành công.';
        setMsg($('loginMsg'), '', '');
        setOpen(res.session, res.remainingSec);
        show('stepInfo');
      } else if (res && res.closed) {
        setClosed();
        setMsg($('loginMsg'), res.error, 'err');
      } else {
        setMsg($('loginMsg'), (res && res.error) || 'Mã không hợp lệ.', 'err');
      }
    }).catch(function () {
      setMsg($('loginMsg'), 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.', 'err');
    }).then(function () { $('loginBtn').disabled = !state.open; });
  });

  // --- Bước 2: vị trí ---
  function getLocation() {
    if (!navigator.geolocation) {
      $('locStatus').textContent = 'Thiết bị hoặc trình duyệt không hỗ trợ định vị.';
      return;
    }
    $('locBtn').disabled = true;
    $('sendBtn').disabled = true;
    state.pos = null;
    $('locStatus').textContent = 'Đang lấy vị trí... hãy chọn "Cho phép" khi trình duyệt hỏi.';
    navigator.geolocation.getCurrentPosition(function (p) {
      state.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
      $('locStatus').textContent = 'Đã lấy vị trí (sai số khoảng ' + Math.round(p.coords.accuracy) + ' m).';
      $('sendBtn').disabled = !state.open;
      $('locBtn').disabled = false;
      $('locBtn').textContent = 'Lấy lại vị trí';
    }, function (err) {
      var m = {
        1: 'Bạn đã từ chối chia sẻ vị trí. Hãy cho phép vị trí cho trang này trong cài đặt trình duyệt rồi bấm "Lấy vị trí hiện tại".',
        2: 'Không xác định được vị trí. Hãy bật GPS/định vị rồi thử lại.',
        3: 'Hết thời gian chờ định vị. Hãy thử lại.'
      };
      $('locStatus').textContent = m[err.code] || 'Không lấy được vị trí.';
      $('locBtn').disabled = false;
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }
  $('locBtn').addEventListener('click', getLocation);

  $('infoForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!state.open) { setMsg($('infoMsg'), 'Đợt điểm danh đã kết thúc.', 'err'); return; }
    if (!state.pos) { setMsg($('infoMsg'), 'Cần lấy vị trí trước khi gửi.', 'err'); return; }
    var fullName = $('fullName').value.trim();
    if (!fullName) { setMsg($('infoMsg'), 'Vui lòng nhập họ tên.', 'err'); return; }
    $('sendBtn').disabled = true;
    setMsg($('infoMsg'), 'Đang gửi...', '');
    api({
      action: 'submit', code: state.code, fullName: fullName, note: $('note').value.trim(),
      lat: state.pos.lat, lng: state.pos.lng, acc: state.pos.acc
    }).then(function (res) {
      if (res && res.ok) {
        $('doneMsg').textContent = 'Điểm danh thành công lúc ' + res.time + '.';
        show('stepDone');
      } else if (res && res.closed) {
        setClosed();
        setMsg($('infoMsg'), res.error, 'err');
      } else {
        setMsg($('infoMsg'), (res && res.error) || 'Gửi không thành công.', 'err');
        $('sendBtn').disabled = !state.open;
      }
    }).catch(function () {
      setMsg($('infoMsg'), 'Không kết nối được máy chủ. Dữ liệu chưa được gửi, hãy thử lại.', 'err');
      $('sendBtn').disabled = !state.open;
    });
  });

  $('againBtn').addEventListener('click', function () {
    state.code = ''; state.pos = null;
    $('code').value = ''; $('note').value = ''; $('fullName').value = '';
    $('locStatus').textContent = 'Chưa lấy vị trí.'; $('locBtn').textContent = 'Lấy vị trí hiện tại';
    setMsg($('infoMsg'), '', ''); $('sendBtn').disabled = true;
    show('stepLogin');
    refreshStatus();
  });
})();
</script>
</body>
</html>
