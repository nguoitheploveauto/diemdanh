<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điểm danh</title>
<link rel="icon" href="cand.png">
<style>
  :root { --g:#14532d; --g2:#166534; --gd:#0b3b20; --red:#c8102e; --gold:#f5c518; --bg:#eaf1ea; --ok:#15803d; --err:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#0f172a;
         background:linear-gradient(180deg,var(--gd) 0,var(--g) 150px,var(--bg) 150px) no-repeat, var(--bg); min-height:100vh; }
  main { max-width:460px; margin:0 auto; padding:14px 16px 28px; }
  .hero { position:relative; height:240px; border-radius:16px 16px 0 0; overflow:hidden; border-bottom:4px solid var(--gold);
          background:linear-gradient(180deg,rgba(11,59,32,.15) 0,rgba(11,59,32,.55) 55%,rgba(11,59,32,.92) 100%),url(banner.jpg) center 20%/cover #14532d;
          box-shadow:0 4px 14px rgba(0,0,0,.25); }
  .hero .org { position:absolute; left:0; right:0; bottom:108px; text-align:center; color:var(--gold); font-weight:700; font-size:13px; letter-spacing:3px; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .hero h1 { position:absolute; left:0; right:0; bottom:64px; margin:0; text-align:center; color:#fff; font-size:28px; letter-spacing:4px; text-shadow:0 2px 4px rgba(0,0,0,.6); }
  .badge { width:96px; height:96px; margin:-48px auto 0; position:relative; z-index:2; border-radius:50%; background:#fff url(cand.png) center/78% no-repeat;
           border:4px solid var(--gold); box-shadow:0 0 0 3px var(--red),0 4px 12px rgba(0,0,0,.3); }
  .card { background:#fff; border-radius:12px; padding:18px; margin-top:14px; border-top:4px solid var(--red); box-shadow:0 2px 8px rgba(11,59,32,.18); }
  label { display:block; font-weight:700; margin:14px 0 6px; font-size:14px; color:var(--g); letter-spacing:.3px; }
  input[type=text], textarea { width:100%; padding:11px 12px; font-size:16px; border:1px solid #b6c7b9; border-radius:8px; font-family:inherit; background:#fbfdfb; }
  input[type=text]:focus, textarea:focus { outline:2px solid var(--g2); border-color:var(--g2); background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  button { width:100%; margin-top:16px; padding:12px; font-size:16px; font-weight:700; letter-spacing:.5px; color:#fff; background:linear-gradient(180deg,var(--g2),var(--g)); border:0; border-bottom:3px solid var(--gold); border-radius:8px; cursor:pointer; }
  button:hover:not(:disabled) { filter:brightness(1.12); }
  button:disabled { background:#94a3b8; border-bottom-color:#cbd5e1; cursor:not-allowed; }
  button.secondary { background:#fff; color:var(--g); border:1px solid var(--g); margin-top:8px; }
  .msg { margin-top:12px; font-size:14px; min-height:20px; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .hint { font-size:13px; color:#475569; margin-top:6px; }
  .consent { display:flex; gap:10px; align-items:flex-start; margin-top:16px; padding:12px; border:1px solid #cfe0d2; background:#f2f8f3; border-radius:8px; font-size:14px; font-weight:400; line-height:1.4; color:#0f172a; letter-spacing:0; }
  .consent input { width:20px; height:20px; margin:2px 0 0; flex:none; accent-color:var(--g2); }
  .hidden { display:none; }
  .warn { background:#fef3c7; border:1px solid #f59e0b; padding:10px; border-radius:8px; font-size:14px; margin-top:14px; }
  .banner { padding:10px 12px; border-radius:8px; font-size:14px; margin-top:14px; background:#dcfce7; color:#14532d; border-left:4px solid var(--g2); }
  .banner.closed { background:#fee2e2; color:#7f1d1d; border-left-color:var(--red); }
  .banner b { font-variant-numeric:tabular-nums; }
  .foot { text-align:center; margin-top:22px; font-size:13px; color:var(--g); }
  .foot .star { color:var(--red); font-size:16px; }
  .foot b { display:block; margin-top:2px; letter-spacing:.5px; }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="org">CÔNG AN NHÂN DÂN</div>
    <h1>ĐIỂM DANH</h1>
  </header>
  <div class="badge" role="img" aria-label="Huy hiệu Công an nhân dân"></div>

  <div id="cfgWarn" class="warn hidden">Chưa cấu hình địa chỉ máy chủ. Mở file này bằng trình soạn thảo và điền APPS_SCRIPT_URL ở đầu phần script.</div>
  <div id="banner" class="banner hidden" role="status"></div>

  <!-- Bước 1: nhập SỐ CNN -->
  <section id="stepLogin" class="card">
    <form id="loginForm" autocomplete="off">
      <label for="code">SỐ CNN</label>
      <input id="code" type="text" inputmode="numeric" autocapitalize="characters" spellcheck="false" maxlength="64" required>
      <button id="loginBtn" type="submit">Đăng nhập</button>
      <div id="loginMsg" class="msg" role="status"></div>
    </form>
  </section>

  <!-- Bước 1b: người mở đợt nhập NỘI DUNG ĐIỂM DANH -->
  <section id="stepStart" class="card hidden">
    <form id="startForm" autocomplete="off">
      <div class="hint">Chưa có đợt điểm danh nào đang mở. Nhập nội dung để bắt đầu đợt mới (kéo dài 30 phút).</div>
      <label for="content">NỘI DUNG ĐIỂM DANH</label>
      <input id="content" type="text" maxlength="200" required>
      <button id="startBtn" type="submit">Bắt đầu đợt điểm danh</button>
      <div id="startMsg" class="msg" role="status"></div>
    </form>
  </section>

  <!-- Bước 2: nhập họ tên và đồng ý -->
  <section id="stepInfo" class="card hidden">
    <form id="infoForm" autocomplete="off">
      <div id="welcome" class="hint"></div>
      <label for="fullName">Họ và tên</label>
      <input id="fullName" type="text" maxlength="200" required>
      <label id="consentBox" class="consent" for="agree">
        <input id="agree" type="checkbox">
        <span>Tôi đồng ý điểm danh và đồng ý chia sẻ vị trí hiện tại của tôi (trình duyệt sẽ hỏi quyền vị trí khi gửi).</span>
      </label>
      <button id="sendBtn" type="submit">Điểm danh</button>
      <div id="infoMsg" class="msg" role="status"></div>
    </form>
  </section>

  <!-- Bước 3: xong -->
  <section id="stepDone" class="card hidden">
    <h2 style="margin-top:0">Đã ghi nhận</h2>
    <div id="doneMsg"></div>
    <button id="againBtn" type="button" class="secondary">Quay về đầu</button>
  </section>
  <footer class="foot"><span class="star">&#9733;</span><b>Vì nước quên thân, vì dân phục vụ</b></footer>
</main>

<script>
(function () {
  'use strict';
  // >>> Địa chỉ ứng dụng web Apps Script (kết thúc bằng /exec) <<<
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZM4PO45DtIJBcrNvgs8tjGwg84WpTmsPfQJ7OwmqnIG9QrgN4LwAROdXffNYhF0YxjQ/exec';

  var $ = function (id) { return document.getElementById(id); };
  var STEPS = ['stepLogin', 'stepStart', 'stepInfo', 'stepDone'];
  var state = { code: '', open: false, endAt: 0, sessionName: '' };
  var tick = null, poll = null;
  // Máy tính (không phải điện thoại/máy tính bảng): không yêu cầu vị trí
  var IS_PC = !(/Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));

  if (!APPS_SCRIPT_URL) $('cfgWarn').classList.remove('hidden');

  function show(id) {
    STEPS.forEach(function (s) { $(s).classList.add('hidden'); });
    $(id).classList.remove('hidden');
  }
  function setMsg(el, text, cls) { el.textContent = text; el.className = 'msg ' + (cls || ''); }

  // Gửi POST dạng text/plain để tránh preflight CORS với Apps Script.
  function api(payload) {
    if (!APPS_SCRIPT_URL) return Promise.reject(new Error('Chưa cấu hình máy chủ.'));
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }

  // --- Trạng thái đợt điểm danh và đồng hồ đếm ngược ---
  function fmt(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function renderBanner() {
    var b = $('banner');
    b.classList.remove('hidden');
    if (state.open) {
      var left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));
      if (left <= 0) { setClosed(); return; }
      b.className = 'banner';
      b.textContent = '';
      b.appendChild(document.createTextNode('Đợt: ' + state.sessionName + ' — còn lại '));
      var t = document.createElement('b'); t.textContent = fmt(left); b.appendChild(t);
    } else {
      b.className = 'banner closed';
      b.textContent = 'Hiện không có đợt điểm danh nào đang mở.';
    }
  }
  function setOpen(name, remainingSec) {
    state.open = true; state.sessionName = name;
    state.endAt = Date.now() + remainingSec * 1000;   // dùng giờ máy chủ, không phụ thuộc đồng hồ máy người dùng
    renderBanner();
    clearInterval(tick); tick = setInterval(renderBanner, 1000);
    clearInterval(poll); poll = null;
  }
  function setClosed() {
    var onInfo = !$('stepInfo').classList.contains('hidden');
    state.open = false;
    clearInterval(tick); tick = null;
    $('sendBtn').disabled = true;
    renderBanner();
    if (onInfo) setMsg($('infoMsg'), 'Đợt điểm danh đã kết thúc, dữ liệu chưa gửi sẽ không được ghi nhận.', 'err');
    clearInterval(poll); poll = setInterval(refreshStatus, 60000);   // tự cập nhật khi có đợt mới
  }
  function refreshStatus() {
    api({ action: 'status' }).then(function (res) {
      if (res && res.ok && res.open) setOpen(res.name, res.remainingSec);
      else if (res && res.ok) setClosed();
    }).catch(function () {
      $('banner').className = 'banner closed';
      $('banner').textContent = 'Không kết nối được máy chủ.';
    });
  }
  if (APPS_SCRIPT_URL) refreshStatus();

  // Chuyển sang màn nhập họ tên
  function goInfo(res) {
    $('fullName').value = res.name || '';
    $('welcome').textContent = res.name ? 'Xin chào ' + res.name + (res.unit ? ' (' + res.unit + ')' : '') + '.' : 'Đăng nhập thành công.';
    $('agree').checked = false;
    $('sendBtn').disabled = false;
    setMsg($('infoMsg'), '', '');
    $('consentBox').classList.toggle('hidden', IS_PC);
    show('stepInfo');
  }

  // --- Bước 1: đăng nhập bằng SỐ CNN ---
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value.trim();
    if (!code) return;
    $('loginBtn').disabled = true;
    setMsg($('loginMsg'), 'Đang kiểm tra...', '');
    api({ action: 'login', code: code }).then(function (res) {
      if (res && res.ok) {
        state.code = code;
        setMsg($('loginMsg'), '', '');
        if (res.running) {
          setOpen(res.session, res.remainingSec);
          goInfo(res);
        } else if (res.admin) {              // người mở đợt: chưa có đợt nào
          $('content').value = '';
          setMsg($('startMsg'), '', '');
          show('stepStart');
        } else {
          setClosed();
          setMsg($('loginMsg'), 'Hiện không có đợt điểm danh nào đang mở.', 'err');
        }
      } else if (res && res.closed) {
        setClosed();
        setMsg($('loginMsg'), res.error, 'err');
      } else {
        setMsg($('loginMsg'), (res && res.error) || 'Số CNN không hợp lệ.', 'err');
      }
    }).catch(function () {
      setMsg($('loginMsg'), 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.', 'err');
    }).then(function () { $('loginBtn').disabled = false; });
  });

  // --- Bước 1b: người mở đợt nhập NỘI DUNG ĐIỂM DANH ---
  $('startForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var content = $('content').value.trim();
    if (!content) { setMsg($('startMsg'), 'Vui lòng nhập nội dung điểm danh.', 'err'); return; }
    $('startBtn').disabled = true;
    setMsg($('startMsg'), 'Đang mở đợt...', '');
    api({ action: 'start', code: state.code, content: content }).then(function (res) {
      if (res && res.ok) {
        setOpen(res.session, res.remainingSec);
        goInfo(res);
      } else {
        setMsg($('startMsg'), (res && res.error) || 'Không mở được đợt.', 'err');
      }
    }).catch(function () {
      setMsg($('startMsg'), 'Không kết nối được máy chủ. Hãy thử lại.', 'err');
    }).then(function () { $('startBtn').disabled = false; });
  });

  // --- Bước 2: họ tên + đồng ý, vị trí được lấy khi bấm Điểm danh ---
  function getPosition() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) { reject({ code: 0 }); return; }
      navigator.geolocation.getCurrentPosition(resolve, reject,
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }
  var GEO_ERR = {
    0: 'Thiết bị hoặc trình duyệt không hỗ trợ định vị.',
    1: 'Bạn chưa cho phép chia sẻ vị trí nên chưa điểm danh được. Hãy cho phép vị trí cho trang này trong cài đặt trình duyệt rồi bấm Điểm danh lại.',
    2: 'Không xác định được vị trí. Hãy bật GPS/định vị rồi bấm Điểm danh lại.',
    3: 'Hết thời gian chờ định vị. Hãy bấm Điểm danh lại.'
  };

  $('infoForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!state.open) { setMsg($('infoMsg'), 'Đợt điểm danh đã kết thúc.', 'err'); return; }
    var fullName = $('fullName').value.trim();
    if (!fullName) { setMsg($('infoMsg'), 'Vui lòng nhập họ tên.', 'err'); return; }
    if (!IS_PC && !$('agree').checked) { setMsg($('infoMsg'), 'Bạn cần tích đồng ý điểm danh và chia sẻ vị trí.', 'err'); return; }
    $('sendBtn').disabled = true;
    setMsg($('infoMsg'), IS_PC ? 'Đang gửi...' : 'Đang lấy vị trí... hãy chọn "Cho phép" khi trình duyệt hỏi.', '');
    (IS_PC ? Promise.resolve(null) : getPosition()).then(function (p) {
      setMsg($('infoMsg'), 'Đang gửi...', '');
      return api({
        action: 'submit', code: state.code, fullName: fullName, consent: !IS_PC,
        device: IS_PC ? 'pc' : 'mobile',
        lat: p ? p.coords.latitude : null, lng: p ? p.coords.longitude : null, acc: p ? p.coords.accuracy : null
      });
    }).then(function (res) {
      if (res && res.ok) {
        $('doneMsg').textContent = 'Điểm danh thành công lúc ' + res.time + '.';
        show('stepDone');
      } else if (res && res.closed) {
        setClosed();
        setMsg($('infoMsg'), res.error, 'err');
      } else {
        setMsg($('infoMsg'), (res && res.error) || 'Gửi không thành công.', 'err');
        $('sendBtn').disabled = !state.open;
      }
    }).catch(function (err) {
      if (err && typeof err.code === 'number' && GEO_ERR[err.code]) {
        setMsg($('infoMsg'), GEO_ERR[err.code], 'err');
      } else {
        setMsg($('infoMsg'), 'Không kết nối được máy chủ. Dữ liệu chưa được gửi, hãy thử lại.', 'err');
      }
      $('sendBtn').disabled = !state.open;
    });
  });

  $('againBtn').addEventListener('click', function () {
    state.code = '';
    $('code').value = ''; $('fullName').value = ''; $('agree').checked = false;
    setMsg($('infoMsg'), '', ''); setMsg($('loginMsg'), '', '');
    show('stepLogin');
    refreshStatus();
  });
})();
</script>
</body>
</html>
